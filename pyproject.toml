[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peterbot"
version = "0.1.0"
description = "Python framework for analyzing Catholic organizations and their websites."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "warcio>=1.7.4",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
